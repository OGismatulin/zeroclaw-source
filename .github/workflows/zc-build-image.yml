name: ZC Build and Push Image

# Build the ghcr.io/ogismatulin/zeroclaw runtime image from this fork.
# Prefixed zc- to avoid colliding with upstream workflow names on merges.

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  classify-ref:
    runs-on: ubuntu-latest
    outputs:
      is_master: ${{ steps.ref.outputs.is_master }}
    steps:
      - id: ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            echo 'is_master=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_master=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push to GHCR
    needs: classify-ref
    if: ${{ needs.classify-ref.outputs.is_master == 'true' || needs.classify-ref.outputs.is_master == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.classify-ref.outputs.is_master == 'true' && 'zc-build-image-master' || format('zc-build-image-other-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_TOKEN is a PAT with write:packages scope. The default
          # GITHUB_TOKEN cannot push to the ghcr.io/ogismatulin/zeroclaw
          # package because the package is bound to a different repo
          # (OGismatulin/zeroclaw, not OGismatulin/zeroclaw-source) and
          # GitHub provides no public API to rebind packages.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ogismatulin/zeroclaw
          tags: |
            type=raw,value=latest,enable=${{ needs.classify-ref.outputs.is_master == 'true' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image digest
        id: image-receipt
        shell: python
        env:
          BUILD_HEAD_SHA: ${{ github.sha }}
          BUILD_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_REF: ${{ github.ref }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          receipt = {
              "head_sha": os.environ["BUILD_HEAD_SHA"],
              "image_digest": os.environ["BUILD_IMAGE_DIGEST"],
              "run_id": os.environ["BUILD_RUN_ID"],
          }
          for field, pattern in (
              ("head_sha", r"[0-9a-f]{40}"),
              ("image_digest", r"sha256:[0-9a-f]{64}"),
              ("run_id", r"[1-9][0-9]*"),
          ):
              if re.fullmatch(pattern, receipt[field]) is None:
                  raise SystemExit(f"Invalid image receipt {field}")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if receipt["head_sha"] != head:
              raise SystemExit("Image receipt SHA differs from checkout HEAD")
          ref = os.environ["BUILD_REF"]
          if not ref.startswith(("refs/heads/", "refs/tags/")):
              raise SystemExit("Invalid image receipt ref")
          subprocess.run(["git", "check-ref-format", ref], check=True)
          with Path("image-digest.json").open("x", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True)
              output.write("\n")

      - name: Upload immutable image digest
        uses: actions/upload-artifact@v4
        with:
          name: zc-build-image-digest
          path: image-digest.json
          if-no-files-found: error
